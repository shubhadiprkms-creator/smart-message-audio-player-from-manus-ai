name: Dynamic Android APK Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install --legacy-peer-deps || true

      - name: Find and Build Gradle
        run: |
          # gradlew ফাইলটি পুরো প্রজেক্টে খুঁজে বের করবে
          GRADLEW_PATH=$(find . -name "gradlew" -type f | head -n 1)
          
          if [ -z "$GRADLEW_PATH" ]; then
            echo "ERROR: Could not find gradlew in the repository!"
            echo "Printing repository file structure:"
            ls -R
            exit 1
          fi
          
          GRADLE_DIR=$(dirname "$GRADLEW_PATH")
          echo "Found gradlew at: $GRADLEW_PATH"
          
          chmod +x "$GRADLEW_PATH"
          cd "$GRADLE_DIR"
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: "/**/build/outputs/apk/debug/*.apk"
